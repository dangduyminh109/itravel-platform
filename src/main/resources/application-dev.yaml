server:
  port: 9092
  servlet:
    context-path: /api

spring:
  application:
    name: TravelPlatform
  datasource:
    url: "jdbc:mysql://localhost:3306/itravel"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
      springframework:
        security: DEBUG

security:
  jwt:
    signerKey: ""
    valid-duration: 600 # 10 minutes (in seconds)
    issuer: Travel-Platform
    audience: Travel-Platform
  refresh-token:
    secret: ""
    refreshable-duration: 604800 # 1 week (in seconds)
